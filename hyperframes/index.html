<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* 값은 bible/03_style.json과 같게 유지한다. 테스트용으로 맑은 고딕(local)을 쓰고, Pretendard 파일을 assets/fonts에 넣으면 교체한다. */
      @font-face {
        font-family: "ChannelSans";
        src: local("Malgun Gothic");
        font-weight: 400;
      }
      @font-face {
        font-family: "ChannelSans";
        src: local("Malgun Gothic Bold");
        font-weight: 900;
      }
      :root {
        --bg: #0e0f12;
        --text: #f2efe9;
        --accent: #e8b04b;
        --muted: #6b6f76;
        --muted-text: #8a8e95;
        --fact: #7fb2c9;
        --font: "ChannelSans", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font);
        color: var(--text);
      }
      #marker {
        position: absolute;
        top: 96px;
        left: 96px;
      }
      #marker span {
        display: inline-block;
        font-size: 28px;
        color: var(--fact);
        border: 2px solid var(--fact);
        border-radius: 6px;
        padding: 4px 14px;
      }
      #figure {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #figure .row {
        display: flex;
        align-items: baseline;
        gap: 40px;
      }
      #figure .old {
        font-size: 120px;
        font-weight: 900;
        color: var(--muted);
        text-decoration: line-through;
      }
      #figure .arrow {
        font-size: 80px;
        color: var(--muted);
      }
      #figure .new {
        font-size: 220px;
        font-weight: 900;
        color: var(--accent);
      }
      #figure .unit {
        font-size: 64px;
        font-weight: 900;
      }
      #figure .caption {
        margin-top: 24px;
        font-size: 44px;
      }
      #source {
        position: absolute;
        left: 96px;
        bottom: 96px;
      }
      #source span {
        display: inline-block;
        font-size: 28px;
        color: var(--muted-text);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="marker" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <span id="marker-label">사실</span>
      </div>

      <div id="figure" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="row" id="figure-row">
          <span class="old" id="old">4,000</span>
          <span class="arrow" id="arrow">→</span>
          <span class="new" id="new">0</span>
          <span class="unit" id="unit">시간</span>
        </div>
        <div class="caption" id="caption">신규 채널 수익화에 필요한 <span style="color: var(--accent)">시청 시간</span></div>
      </div>

      <div id="source" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <span id="source-label">출처: YouTube 파트너 프로그램 기준 (2027-02-01 시행 예정) · 테스트 화면</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const ease = "expo.out";
      tl.fromTo("#marker-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease }, 0);
      tl.fromTo("#old", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease }, 0.2);
      tl.fromTo("#arrow", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease }, 0.6);
      tl.fromTo("#new", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease }, 0.8);
      tl.fromTo("#unit", { opacity: 0 }, { opacity: 1, duration: 0.3, ease }, 0.8);
      // 숫자 카운트업 800ms (03_style.json motion.numberCount)
      const counter = { v: 0 };
      tl.to(
        counter,
        {
          v: 8000,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: () => {
            document.getElementById("new").textContent = Math.round(counter.v).toLocaleString("en-US");
          },
        },
        0.8
      );
      tl.fromTo("#caption", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease }, 1.6);
      tl.fromTo("#source-label", { opacity: 0 }, { opacity: 1, duration: 0.3, ease }, 1.6);
      tl.to("#figure-row, #caption, #source-label, #marker-label", { opacity: 0, duration: 0.2 }, 5.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
